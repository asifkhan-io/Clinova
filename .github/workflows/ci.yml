name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in step with the Node version set on the Vercel project.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `npm run typecheck` is `next typegen && tsc --noEmit`.
      # typegen writes the generated route types (PageProps, LayoutProps,
      # RouteContext) that the app relies on; tsc alone would fail without it.
      - run: npm run typecheck

      # Tenant isolation + authorization (Phase 2 DoD 5 and 6), against an
      # in-memory Postgres with the real migrations. No secrets needed.
      - run: npm test
